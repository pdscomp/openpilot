name: Build Prebuilt

# Branch-generic prebuilt builder for the comma 3X self-hosted runner (label: tici).
# Lives on source branches and publishes a single-root prebuilt branch in THIS repo:
#   push to rel-src -> builds rel-src -> publishes rel
#   push to stg-src -> builds stg-src -> publishes stg
#   push to AdventurePilot/c3xl/stg -> builds it -> publishes AdventurePilot-c3xl-stg-candidate-tici
# Same-repo publish uses the built-in GITHUB_TOKEN (no PAT). GITHUB_TOKEN pushes don't re-trigger CI,
# so publishing the flat branch can't loop.
#
# Safety carried over from the known-good build:
#   - LFS: never carry .gitattributes into the published tree (so `git add` can't re-pointerize real
#     binaries) + a hard pointer-stub guard.
#   - RUNPATH: build in /data/openpilot (the device's RUNTIME path). The runner's `unshare -m`
#     bind-mounts /data/github/openpilot over /data/openpilot for the job, so the build is isolated
#     from the device's own openpilot AND bakes the path the device actually runs from.
#   - boot: always() clean the build dir (contents only -- it's a bind-mount point) + re-enable
#     powersave, so a job can't leave openpilot dirty.

on:
  push:
    branches: [ rel-src, stg-src, "AdventurePilot/c3xl/stg" ]
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to build (blank = the branch you run this from)"
        required: false
        default: ""

permissions:
  contents: read

env:
  SOURCE_BRANCH: ${{ github.event.inputs.source_branch || github.ref_name }}
  BUILD_DIR: "/data/openpilot"  # MUST equal the device's runtime path (see RUNPATH note in header)
  OUTPUT_DIR: ${{ github.workspace }}/output
  SCONS_CACHE_DIR: ${{ github.workspace }}/release/ci/scons_cache
  CACHEDB: "/data/cache/tinygrad/cache.db"
  XDG_CACHE_HOME: "/data/cache"

jobs:
  build:
    runs-on: [self-hosted, tici]
    concurrency:
      group: build-${{ github.event.inputs.source_branch || github.ref_name }}
      cancel-in-progress: false
    outputs:
      source_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Validate source branch
        id: validate
        shell: bash
        run: |
          case "$SOURCE_BRANCH" in
            rel-src|stg-src|AdventurePilot/c3xl/stg) ;;
            *) echo "::error::unsupported source branch: $SOURCE_BRANCH"; exit 1 ;;
          esac

      - name: Reclaim workspace (previous builds leave root-owned files)
        run: |
          # scons/uv leave root-owned *.egg-info under the vendored submodules. actions/checkout then
          # can't `git clean` them, falls back to deleting the workspace, and dies with EACCES before
          # the job even starts. Hand the tree back to the job user first; harmless on a fresh runner.
          sudo chown -R "$(id -un):$(id -gn)" "${{ github.workspace }}" 2>/dev/null || true

      - name: Checkout source branch (submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: refs/heads/${{ env.SOURCE_BRANCH }}
          persist-credentials: false

      - name: LFS pull (guarantee real bytes, not pointers)
        run: git lfs pull

      - name: Record source commit
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ github.sha }}
          restore-keys: |
            scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}
            scons-${{ runner.os }}-${{ runner.arch }}

      - name: Set environment variables (+ provision cache dir & venv; survives a /data wipe)
        run: |
          source /etc/profile
          export UV_PROJECT_ENVIRONMENT=${HOME}/venv
          unset VIRTUAL_ENV
          # These are NOT created by the runner install, so a /data wipe destroys them and the build
          # would fail assuming they pre-exist. Recreate idempotently:
          #   - the tinygrad/XDG cache dir, owned by the job user (github-runner can't mkdir under
          #     /data otherwise: /data is comma:comma 755);
          #   - a venv synced to THIS branch's lockfile, built against the device's SYSTEM Python.
          #     The device runs 3.12.x and requires-python allows it; pin to it so uv doesn't demand a
          #     managed 3.12.13 download (comma's uv is python-preference=only-system, downloads blocked).
          sudo mkdir -p /data/cache/tinygrad && sudo chown -R github-runner:github-runner /data/cache
          # --extra tools: upstream moved comma-deps-bzip2 and -ncurses out of the core deps into the
          # `tools` extra, but SConstruct still imports both unconditionally (pkg_names), so a plain
          # sync now dies with "No module named 'bzip2'" before it reads a single SConscript. eigen is
          # still covered: default-groups = ["standalone"] pulls openpilot[submodules] -> rednose -> eigen.
          uv sync --frozen --extra tools --python /usr/local/venv/bin/python
          # Put the venv first on PATH so the Build step's `scons`/`python` come straight from it
          # (not the comma shim's `uv run`, which would re-resolve to the pinned 3.12.13 and fail).
          export VIRTUAL_ENV="${UV_PROJECT_ENVIRONMENT}"
          echo "${UV_PROJECT_ENVIRONMENT}/bin" >> "$GITHUB_PATH"
          printenv >> $GITHUB_ENV

      - name: Setup build environment
        run: |
          # BUILD_DIR is the bind-mounted /data/openpilot (job namespace masks the runner's own
          # openpilot with github-runner-owned /data/github/openpilot). Ensure it exists, is empty,
          # and is owned by the job user before rsyncing the source in.
          sudo mkdir -p "${BUILD_DIR}/"
          sudo find $BUILD_DIR/ -mindepth 1 -delete
          sudo chown github-runner:github-runner "${BUILD_DIR}"
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --disable

      - name: Build
        run: |
          export PYTHONPATH="$BUILD_DIR"
          # Copy only release-manifest files (this is why .gitattributes never enters the tree).
          ./tools/release/release_files.py | sort | uniq | rsync -rRl --files-from=- . $BUILD_DIR/
          cd $BUILD_DIR
          sed -i '/from .board.jungle import PandaJungle, PandaJungleDFU/s/^/#/' panda/__init__.py
          echo "Building sunnypilot's modeld_v2..."
          scons -j$(nproc) cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal openpilot/sunnypilot/modeld_v2
          echo "Building sunnypilot's locationd..."
          scons -j2 cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal openpilot/sunnypilot/selfdrive/locationd
          echo "Building openpilot's locationd..."
          scons -j$(nproc) cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal openpilot/selfdrive/locationd
          echo "Building rest of sunnypilot..."
          scons -j$(nproc) cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal
          # comma-deps-ffmpeg is a SHARED build now, so loggerd/encoderd need libav* at runtime and the
          # linker's RPATH points into THIS venv -- a path no tester's device has. Ship the three libs next to
          # the binaries ($ORIGIN is on their RPATH); each lib already has RUNPATH=$ORIGIN so they find each other.
          FFMPEG_LIB=$(python3 -c 'import ffmpeg; print(ffmpeg.LIB_DIR)')
          echo "Vendoring ffmpeg libs from ${FFMPEG_LIB}"
          cp -av "${FFMPEG_LIB}"/libavformat.so.* "${FFMPEG_LIB}"/libavcodec.so.* "${FFMPEG_LIB}"/libavutil.so.* \
                 ${BUILD_DIR}/openpilot/system/loggerd/
          touch ${BUILD_DIR}/prebuilt

      - name: Prepare Output
        run: |
          sudo rm -rf ${OUTPUT_DIR}
          mkdir -p ${OUTPUT_DIR}
          rsync -am \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.pyc' \
            --exclude='moc_*' \
            --exclude='__pycache__' \
            --exclude='Jenkinsfile' \
            --exclude='**/release/' \
            --exclude='**/.github/' \
            --exclude='**/selfdrive/ui/replay/' \
            --exclude='**/__pycache__/' \
            --exclude="${SCONS_CACHE_DIR}" \
            --exclude='**/.git/' \
            --exclude='**/.gitattributes' \
            --exclude='**/SConstruct' \
            --exclude='**/SConscript' \
            --exclude='**/.venv/' \
            --exclude='openpilot/selfdrive/modeld/models/*driving*.onnx' \
            --exclude='openpilot/third_party/*x86*' \
            --exclude='openpilot/third_party/*Darwin*' \
            --delete-excluded \
            --chown=comma:comma \
            ${BUILD_DIR}/ ${OUTPUT_DIR}/

      - name: Guard - every shared lib the binaries need must be resolvable
        run: |
          # A binary whose NEEDED libs resolve only through a build-machine RPATH links and runs fine here, then
          # dies on the tester's device as "Process Not Running" -- with no logs at all, if the dead process is
          # loggerd. Resolve each ELF's NEEDED list the way the device's loader will: against its own RUNPATH
          # entries ($ORIGIN expanded, and /data/openpilot remapped onto the staged output since that IS the
          # device path), then the system dirs. A RUNPATH into a build venv still won't resolve -- the point.
          fail=0
          while read -r bin; do
            head -c 4 "$bin" | grep -q ELF || continue
            d=$(dirname "$bin")
            dirs=("$d")
            for p in $(readelf -d "$bin" 2>/dev/null | grep -oP 'Library (runpath|rpath): \[\K[^]]+' | tr ':' '\n'); do
              p=${p//\$ORIGIN/$d}
              case "$p" in /data/openpilot/*) p="${OUTPUT_DIR}${p#/data/openpilot}" ;; esac
              dirs+=("$p")
            done
            for need in $(readelf -d "$bin" 2>/dev/null | grep -oP 'Shared library: \[\K[^]]+'); do
              case "$need" in
                libc.so.*|libm.so.*|libdl.so.*|libpthread.so.*|librt.so.*|libstdc++.so.*|libgcc_s.so.*) continue ;;
              esac
              found=0
              for p in "${dirs[@]}"; do
                if [ -e "$p/$need" ]; then found=1; break; fi
              done
              if [ "$found" = "0" ] && { [ -e "/usr/lib/$need" ] || [ -e "/lib/$need" ]; }; then found=1; fi
              if [ "$found" = "0" ] && /sbin/ldconfig -p 2>/dev/null | grep -q " $need "; then found=1; fi
              if [ "$found" = "0" ]; then
                echo "::error::$bin needs $need, which the device's loader will not find"
                readelf -d "$bin" 2>/dev/null | grep -E 'runpath|rpath' | sed 's/^/    /'
                fail=1
              fi
            done
          done < <(find "${OUTPUT_DIR}" -type f -perm -u+x)
          [ "$fail" = "0" ] || exit 1
          echo "OK: every NEEDED shared lib resolves on-device."

      - name: Guard - fail on any LFS pointer stub
        run: |
          # An LFS pointer stub is a tiny text file whose FIRST line is exactly
          # `version https://git-lfs.github.com/spec/v1`. Anchor on that line-start so we don't flag
          # legit source that merely mentions the spec URL mid-line. grep -I skips binaries.
          if grep -rlIE "^version https://git-lfs\.github\.com/spec/v1" "${OUTPUT_DIR}" > /tmp/lfs_ptrs.txt; then
            echo "::error::LFS pointer stubs found in build output (would brick the device):"
            cat /tmp/lfs_ptrs.txt
            exit 1
          fi
          # GitHub rejects any file >100MB on push -> the publish would fail silently. Catch it loud here.
          if find "${OUTPUT_DIR}" -type f -size +99M | grep -q .; then
            echo "::error::file(s) >99MB in output (GitHub push would reject them):"
            find "${OUTPUT_DIR}" -type f -size +99M -exec ls -lh {} +
            exit 1
          fi
          echo "OK: no LFS pointer stubs or oversized files in output."

      - name: Tar files
        run: |
          tar czf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }} .
          ls -la prebuilt.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: prebuilt.tar.gz

      # --- boot-safety: always restore the device, even if the build failed ---
      - name: Re-enable powersave
        if: ${{ always() && steps.validate.outcome == 'success' }}
        run: |
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --enable

      - name: Cleanup build directory
        if: ${{ always() && steps.validate.outcome == 'success' }}
        # BUILD_DIR is a bind-mount point (/data/openpilot), so clear its CONTENTS, not the dir itself
        # (rm -rf the mountpoint would EBUSY and fail this always() step -> would fail the build job).
        run: sudo find ${BUILD_DIR}/ -mindepth 1 -delete 2>/dev/null || true

  publish:
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ github.event.inputs.source_branch || github.ref_name }}
      cancel-in-progress: true
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt

      - name: Untar prebuilt
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          tar xzf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Publish single-root prebuilt
        env:
          SRC: ${{ github.event.inputs.source_branch || github.ref_name }}
          REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Preserve AP's rel-src/stg-src convention; C3XL publishes only to its candidate ref.
          case "$SRC" in
            rel-src)                    DEV_BRANCH="rel" ;;
            stg-src)                    DEV_BRANCH="stg" ;;
            AdventurePilot/c3xl/stg)    DEV_BRANCH="AdventurePilot-c3xl-stg-candidate-tici" ;;
            *) echo "::error::unsupported source branch: $SRC"; exit 1 ;;
          esac
          GIT_ORIGIN="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          echo "[-] publishing ${SRC} -> ${DEV_BRANCH} on ${REPO}"
          cd ${{ env.OUTPUT_DIR }}
          # LFS safety (belt + suspenders): no .gitattributes => `git add` cannot re-pointerize.
          find . -name .gitattributes -delete
          # Final pre-commit guard (anchored to the pointer's `version` first line; see build job).
          if grep -rlIE "^version https://git-lfs\.github\.com/spec/v1" . > /tmp/lfs_ptrs.txt; then
            echo "::error::LFS pointer stubs present at publish time:"; cat /tmp/lfs_ptrs.txt; exit 1
          fi
          VERSION_LINE="$(< openpilot/sunnypilot/common/version.h)"
          SP_VERSION="${VERSION_LINE#*\"}"
          SP_VERSION="${SP_VERSION%%\"*}"
          if [ -z "$SP_VERSION" ]; then
            echo "::error::could not read SUNNYPILOT_VERSION"; exit 1
          fi
          DATETIME="$(date '+%Y-%m-%dT%H:%M:%S')"
          SOURCE_URL="https://github.com/${REPO}/tree/${SOURCE_SHA}"
          git init -q
          git checkout -q --orphan "$DEV_BRANCH"
          git add -f .
          git commit -q -m "sunnypilot v${SP_VERSION}
          version: sunnypilot v${SP_VERSION}
          date: ${DATETIME}
          source branch: ${SRC}
          source commit: ${SOURCE_SHA}
          source: ${SOURCE_URL}"
          # A flat prebuilt is one complete root commit, not the source repository's history.
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 1
          git push -f "$GIT_ORIGIN" "HEAD:refs/heads/$DEV_BRANCH"
